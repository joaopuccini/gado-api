services:
  db:
    image: postgres:16-alpine
    container_name: gado-db
    restart: always
    environment:
      POSTGRES_USER: gado_user
      POSTGRES_PASSWORD: gado_password
      POSTGRES_DB: gado_db
    ports:
      - "5432:5432"
    volumes:
      - gado_postgres_data:/var/lib/postgresql/data

  api:
    build: .
    container_name: gado-api
    restart: always
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: "postgresql://gado_user:gado_password@db:5432/gado_db?schema=gado_fazendas"
      JWT_SECRET: "MUDAR_PARA_PRODUCAO_123"
      NODE_ENV: production
    depends_on:
      - db

volumes:
  gado_postgres_data:
